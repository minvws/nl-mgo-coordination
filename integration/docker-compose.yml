name: mgo-integration
services:
  dvp:
    build:
      context: .
      dockerfile: ./docker/dvp/Dockerfile
      args:
        NEW_UID: ${NEW_UID:-1000}
        NEW_GID: ${NEW_GID:-1000}
    ports:
      - 9000:80
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    volumes:
      - './services/dvp/:/var/www/html'
      - 'max-secrets:/var/run/secrets'
    networks:
      - max-public
    depends_on:
      max:
        condition: service_healthy
      prs:
        condition: service_healthy
  dva:
    build:
      context: ./
      dockerfile: docker/dva/Dockerfile
    environment:
      - DEV=false
    volumes:
      - ./services/dva:/code
    ports:
      - 8001:80
      - 5678:5678
    networks:
      - dva-demo
    depends_on:
      prs:
        condition: service_healthy
  max:
    build:
      context: ./submodules/max
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${NEW_UID:-1000}
        GID: ${NEW_GID:-1000}
        INSTALL_NPM_ASSETS: true
      secrets:
        - npmrc
    volumes:
      - './submodules/max:/src'
      - './docker/max/clients.json:/src/clients.json'
      - './docker/max/login_methods.json:/src/login_methods.json'
      - './docker/max/app.conf.example:/src/app.conf'
      - '/src/node_modules'
      - '/src/static/assets'
      - './docker/max/version.json:/src/static/version.json'
      - 'max-secrets:/secrets'
      - 'max-secrets:/src/secrets'
    depends_on:
      redis-init:
        condition: service_completed_successfully
      secrets-manager:
        condition: service_completed_successfully
      brp:
        condition: service_started
      cbp:
        condition: service_healthy
    ports:
      - '8006:8006'
    networks:
      - max-public
      - max-internal
      - client-sync
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--insecure", "https://localhost:8006/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  prs:
    build:
      context: ./submodules/prs
      dockerfile: ./docker/Dockerfile
      args:
        NEW_UID: ${NEW_UID:-1000}
        NEW_GID: ${NEW_GID:-1000}
    volumes:
      - './submodules/prs:/src'
      - ./docker/prs/app.conf.example:/src/app.conf
      - 'max-secrets:/var/run/secrets'
      - 'prs-secrets:/secrets'
    depends_on:
      secrets-manager:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:6502/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - '8005:6502'
    networks:
      - max-public
      - max-internal
      - dva-demo
  brp:
    image: ghcr.io/brp-api/personen-mock:2.7.0-latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:5010
    volumes:
      - './docker/brp/test-data.json:/app/Data/test-data.json'
    ports:
      - "5010:5010"
    networks:
      - max-public
  redis:
    image: redis:6.2
    restart: 'no'
    ports:
      - '6379:6379'
    networks:
      - max-internal
  redis-init:
    depends_on:
      - redis
    image: redis:6.2
    restart: 'no'
    command: 'redis-cli -h redis set max:primary_identity_provider tvs'
    networks:
      - max-internal
  secrets-manager:
    build:
      context: ./docker
      dockerfile: secrets-manager/Dockerfile
    volumes:
      - max-secrets:/secrets
      - prs-secrets:/prs-secrets
  secrets:
    build:
      context: ./docker/secrets
    container_name: apache_secrets
    depends_on:
      - secrets-manager
    volumes:
      - max-secrets:/usr/local/apache2/htdocs
      - prs-secrets:/usr/local/apache2/htdocs
    networks:
      - max-public
    ports:
      - '8007:80'
  dvp-proxy:
    build:
      context: ./submodules/dvp-proxy/services/proxy
      dockerfile: docker/Dockerfile
      args:
        NEW_UID: ${NEW_UID:-1000}
        NEW_GID: ${NEW_GID:-1000}
    ports:
      - 8801:8801
    environment:
      - APP_PORT=8801
    volumes:
      - './submodules/dvp-proxy/services/proxy:/src'
      - './docker/dvp-proxy/app.conf.example:/src/app.conf'
      - 'max-secrets:/src/max-secrets'
    networks:
      - max-public
    depends_on:
      max:
        condition: service_healthy
      secrets-manager:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8801" ]
      interval: 10s
      timeout: 5s
      retries: 3

  load:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./submodules/load
      dockerfile: Dockerfile
      args:
        NEW_UID: ${NEW_UID:-1000}
        NEW_GID: ${NEW_GID:-1000}
    ports:
      - 8808:8006    
    volumes:
      - './submodules/load:/src'
      - './scripts/load/healthcheck.py:/var/run/healthcheck.py'
    networks:
      - load
    healthcheck:
      test: ["CMD", "python3", "/var/run/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      

  postgres:
    image: postgres:14.10-bookworm
    environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=lo_ad_db
    ports:
        - 5432:5432
    volumes:
        - postgres_data:/var/lib/postgresql/data
    networks:
      load:
        aliases:
          - postgresql
          - database
    security_opt:
        - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  cbp:
    build:
      context: ./submodules/cbp/vendor/laravel/sail/runtimes/8.3
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${NEW_GID-1000}'
    image: sail-8.3/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 8008:80
    environment:
      WWWUSER: '${NEW_UID:-1000}'
      LARAVEL_SAIL: '1'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      APP_ENV: "local"
      SKIP_AUTHENTICATION: 'true'
    volumes:
      - './submodules/cbp:/var/www/html/'
    networks:
      - client-sync
    depends_on:
      - cbp-pgsql
      - cbp-mailpit
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cbp-pgsql:
    image: 'postgres:15'
    ports:
      - '5433:5432'
    environment:
      PGPASSWORD: secret
      POSTGRES_DB: cbp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - 'cbp-pgsql:/var/lib/postgresql/data'
      - './submodules/cbp/vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
    networks:
      - client-sync
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - 'cbp_db'
        - '-U'
        - 'postgres'
      retries: 3
      timeout: 5s

  cbp-mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - client-sync

networks:
  max-public:
    driver: bridge
  max-internal:
    driver: bridge
  dva-demo:
    driver: bridge
  load:
    driver: bridge
  client-sync:
    driver: bridge

volumes:
  max-secrets:
  prs-secrets:
  postgres_data:
  cbp-pgsql:

secrets:
  npmrc:
    file: ~/.npmrc
