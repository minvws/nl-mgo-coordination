[project]
name = "mgo-coordination-regression-tests"
version = "0.1.0"
description = "Regression tests for MGO coordination repo"
authors = [
    {name = "Rein van der Vegt",email = "ren.vegt@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
robotframework-appiumlibrary = ">=2.1.0,<4.0.0"
robotframework-assertion-engine = ">=3.0.3,<4.0.0"
robotframework-browser = "==19.7.0"
robotframework-jsonlibrary = ">=0.5,<0.6"
robotframework-pythonlibcore = ">=4.4.1,<5.0.0"
robotframework-requests = ">=0.9.7,<0.10.0"
robotframework-robocop = ">=6.5.0,<7.0.0"
robotframework-tidy = ">=4.18.0,<5.0.0"
protobuf = "^6.31.1"
ruff = "^0.14.6"
isort = "^7.0.0"
beautifulsoup4 = "^4.14.2"
python-dotenv = "^1.2.1"
black = "^25.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.robocop]
language = ["en"]

[tool.robocop.lint]
reports = ["all"]
persistent = true
compare = true
configure = [
    "line-too-long.line_length=200",
    "inconsistent-assignment.assignment_sign_type=none"
]
ignore = [
    "section-variable-not-uppercase",
    "wrong-case-in-keyword-name",
    "too-many-calls-in-keyword",
    "missing-doc-keyword",
    "no-test-variable",
    "no-suite-variable"
]

[tool.robocop.format]
diff = false
overwrite = true
line_length = 120
separator = "space"
space_count = 4
line_ending = "native"
reruns = 3
select = [
    "AddMissingEnd",
    "AlignSettingsSection",
    "AlignTemplatedTestCases",
    "AlignVariablesSection",
    "DiscardEmptySections",
    "InlineIf",
    "MergeAndOrderSections",
    "NormalizeAssignments",
    "NormalizeComments",
    "NormalizeNewLines",
    "NormalizeSectionHeaderName",
    "NormalizeSeparators",
    "NormalizeSettingName",
    "NormalizeTags",
    "OrderSettings",
    "OrderSettingsSection",
    "RemoveEmptySettings",
    "RenameKeywords",
    "RenameTestCases",
    "RenameVariables",
    "ReplaceBreakContinue",
    "ReplaceEmptyValues",
    "ReplaceReturns",
    "ReplaceRunKeywordIf",
    "SplitTooLongLine",
]
configure = [
    "NormalizeAssignments.equal_sign_type=remove",
    "OrderSettingsSection.new_lines_between_groups=0",
    "NormalizeNewLines.section_lines=2",
    "NormalizeNewLines.test_case_lines=1",
    "NormalizeNewLines.keyword_lines=1",
    "NormalizeNewLines.consecutive_lines=0",
    "RenameVariables.unknown_variables_case=upper",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"] # line too ling

[tool.ruff.format]
docstring-code-format = false

[dependency-groups]
ruff = [
    "ruff (>=0.14.3,<0.15.0)"
]
robocop = [
    "robotframework-robocop (>=6.9.2,<7.0.0)"
]
